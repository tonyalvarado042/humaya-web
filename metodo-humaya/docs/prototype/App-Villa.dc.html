<x-dc>

<div style="font-size: 14px; color: #A39B8E">Vista al volcán · Terraza privada · Doble altura</div>
</section>
<div style="height: 150px; flex-shrink: 0; border-radius: 16px; border: 1px dashed #3A352E; background: #12110F; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8C8479">[Foto de la Villa 04]</div>
<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px; border-radius: 16px; background: #151412; border: 1px solid #26231F">
<div><div style="font-size: 12px; color: #A39B8E">Wi‑Fi</div><div style="font-size: 15px; font-weight: 500">Humaya-Villa04</div></div>
<div><div style="font-size: 12px; color: #A39B8E">Clave</div><div style="font-size: 15px; font-weight: 500">[CLAVE]</div></div>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 24px">Cómo funciona tu villa</h2>
<div style="border-radius: 16px; border: 1px solid #26231F; background: #111010; overflow: hidden">
<sc-for list="{{guides}}" as="g" hint-placeholder-count="4">
<div style="border-bottom: 1px solid #1E1C19">
<button type="button" class="acc" onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}"><span>{{g.title}}</span><span style="color: #C8A565; font-size: 20px; line-height: 1">{{g.sign}}</span></button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 16px 16px; font-size: 14px; line-height: 1.55; color: #A39B8E">{{g.body}}</div>
</sc-if>
</div>
</sc-for>
</div>
</section>
<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="#" style="height: 48px; border-radius: 24px; border: 1px solid #3A352E; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #F2EDE4; text-decoration: none">Mapa del lugar</a>

<a href="App-Entrevista.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span>Entrevista</span></a>
<a href="App-Concierge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16v4M17 18h4"></path></svg><span>Concierge</span></a>
<a href="App-Villa.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #C8A565"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span>Mi villa</span></a>

</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0 };
  }
  renderVals() {
    const G = [
      { title: 'Aire acondicionado', body: 'El control está en la pared, al lado de la cama. Encendelo con el botón central; para dormir recomendamos 23 °C y el modo silencioso (botón con la hoja).' },
      { title: 'Agua caliente', body: 'El calentador queda encendido siempre. Girá la llave de la ducha hacia la izquierda y esperá unos 30 segundos.' },
      { title: 'Luces inteligentes', body: 'Panel junto a la puerta: «Día», «Atardecer» y «Noche». También podés pedirle al concierge que las cambie por vos.' },
      { title: 'Cocina', body: 'Cafetera de filtro, café de la zona y agua filtrada en la refri. Si necesitás algo más, escribinos.' }
    ];
    return {
      guides: G.map((g, i) => {
        const open = this.state.open === i;
        return {
          title: g.title,
          body: g.body,
          open: open,
          expanded: open ? 'true' : 'false',
          sign: open ? '−' : '+',
          toggle: () => this.setState({ open: open ? -1 : i })
        };
      })
    };
  }
}
</script>
</body>
