<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Humaya · Reservas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A;font-family:'Jost',sans-serif;color:#F2EDE4}
a{color:#C8A565}a:hover{color:#E3C58A}
.tab{flex:1;height:44px;border:0;border-radius:22px;background:transparent;color:#A39B8E;font:500 14px 'Jost',sans-serif;cursor:pointer}
.tab.on{background:#C8A565;color:#0A0A0A}
.day{flex:1;height:60px;border-radius:14px;border:1px solid #26231F;background:#111010;color:#F2EDE4;font:500 14px 'Jost',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.on{border-color:#C8A565;color:#E3C58A}
.slot{height:44px;border-radius:12px;border:1px solid #3A352E;background:#151412;color:#F2EDE4;font:500 14px 'Jost',sans-serif;cursor:pointer}
.slot:hover{border-color:#C8A565}
.slot.on{background:#C8A565;border-color:#C8A565;color:#0A0A0A}
.slot.taken{background:transparent;border-color:#1E1C19;color:#5E5850;text-decoration:line-through;cursor:not-allowed}
.cta{height:52px;border:0;border-radius:26px;background:#C8A565;color:#0A0A0A;font:500 15px 'Jost',sans-serif;cursor:pointer}
.cta:disabled{background:#2A2723;color:#8C8479;cursor:not-allowed}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0A0A; color: #F2EDE4; font-family: 'Jost', sans-serif; overflow: hidden">
<main style="flex-grow: 1; padding: 18px 22px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">
<section style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #C8A565">Bienestar</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 40px; line-height: 1.05">Reservas</h1>
<div style="font-size: 14px; color: #A39B8E">{{facilityInfo}}</div>
</section>
<div role="group" aria-label="Instalación" style="display: flex; padding: 3px; border-radius: 25px; border: 1px solid #26231F; background: #111010">
<button type="button" class="{{saunaCls}}" onClick="{{pickSauna}}">Sauna</button>
<button type="button" class="{{coldCls}}" onClick="{{pickCold}}">Cold plunge</button>
</div>
<div role="group" aria-label="Día" style="display: flex; gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="3"><button type="button" class="{{d.cls}}" onClick="{{d.pick}}"><span style="font-size: 12px; color: #A39B8E">{{d.dow}}</span><span>{{d.num}}</span></button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="t" hint-placeholder-count="9"><button type="button" class="{{t.cls}}" disabled="{{t.taken}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>
<div style="padding: 14px 16px; border-radius: 14px; border: 1px solid #7A6541; background: #12100D; font-size: 14px; line-height: 1.5; color: #A39B8E"><span style="color: #E3C58A; font-weight: 500">Sugerencia para ustedes:</span> sauna al atardecer el domingo y cold plunge temprano el lunes, antes de la caminata.</div>
<sc-if value="{{notConfirmed}}" hint-placeholder-val="{{true}}">
<button type="button" class="cta" disabled="{{noSlot}}" onClick="{{confirm}}">{{ctaLabel}}</button>
</sc-if>
<sc-if value="{{confirmed}}" hint-placeholder-val="{{false}}">
<div style="padding: 16px; border-radius: 14px; background: #151412; border: 1px solid #C8A565; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div><div style="font-size: 12px; color: #A39B8E">Reservado</div><div style="font-size: 15px; font-weight: 500">{{summary}}</div></div>
<button type="button" onClick="{{reset}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A352E; background: transparent; color: #F2EDE4; font: 500 13px 'Jost', sans-serif; cursor: pointer">Cambiar</button>
</div>
</sc-if>
</main>
<nav aria-label="Navegación principal" style="height: 76px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; padding: 0 6px; border-top: 1px solid #26231F; background: #0E0D0C">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg><span>Inicio</span></a>
<a href="App-Entrevista.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span>Entrevista</span></a>
<a href="App-Concierge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16v4M17 18h4"></path></svg><span>Concierge</span></a>
<a href="App-Villa.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span>Mi villa</span></a>
<a href="App-Reservas.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #C8A565"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Reservas</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { facility: 'sauna', day: 0, slot: null, confirmed: false };
  }
  renderVals() {
    const s = this.state;
    const DAYS = [{ dow: 'Dom', num: '15 nov' }, { dow: 'Lun', num: '16 nov' }, { dow: 'Mar', num: '17 nov' }];
    const TIMES = ['6:00', '7:00', '8:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'];
    const TAKEN = {
      sauna: [[1, 5], [0, 3, 7], [2, 4]],
      cold: [[0, 6], [1, 2], [0, 8]]
    };
    const taken = TAKEN[s.facility][s.day];
    const name = s.facility === 'sauna' ? 'Sauna' : 'Cold plunge';
    const noSlot = s.slot === null;
    return {
      facilityInfo: s.facility === 'sauna'
        ? 'Sesiones privadas de 45 minutos, hasta 4 personas.'
        : 'Sesiones privadas de 20 minutos, hasta 2 personas.',
      saunaCls: s.facility === 'sauna' ? 'tab on' : 'tab',
      coldCls: s.facility === 'cold' ? 'tab on' : 'tab',
      pickSauna: () => this.setState({ facility: 'sauna', slot: null, confirmed: false }),
      pickCold: () => this.setState({ facility: 'cold', slot: null, confirmed: false }),
      days: DAYS.map((d, i) => ({
        dow: d.dow, num: d.num,
        cls: i === s.day ? 'day on' : 'day',
        pick: () => this.setState({ day: i, slot: null, confirmed: false })
      })),
      slots: TIMES.map((t, i) => {
        const isTaken = taken.indexOf(i) >= 0;
        return {
          label: t,
          taken: isTaken,
          cls: isTaken ? 'slot taken' : (s.slot === i ? 'slot on' : 'slot'),
          pick: () => { if (!isTaken) this.setState({ slot: i, confirmed: false }); }
        };
      }),
      noSlot: noSlot,
      ctaLabel: noSlot ? 'Elegí un horario' : 'Reservar ' + name + ' · ' + TIMES[s.slot],
      confirm: () => this.setState({ confirmed: true }),
      confirmed: s.confirmed,
      notConfirmed: !s.confirmed,
      summary: noSlot ? '' : name + ' · ' + DAYS[s.day].dow + ' ' + DAYS[s.day].num + ' · ' + TIMES[s.slot],
      reset: () => this.setState({ confirmed: false, slot: null })
    };
  }
}
</script>
</body>
</html>
