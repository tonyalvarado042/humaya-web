<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Humaya · Concierge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A;font-family:'Jost',sans-serif;color:#F2EDE4}
a{color:#C8A565}a:hover{color:#E3C58A}
.chip{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #3A352E;background:#151412;color:#F2EDE4;font:500 13px 'Jost',sans-serif;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#C8A565;color:#E3C58A}
.field{flex:1;height:48px;padding:0 18px;border-radius:24px;border:1px solid #3A352E;background:#151412;color:#F2EDE4;font:400 15px 'Jost',sans-serif;outline:none}
.field:focus{border-color:#C8A565}
.field::placeholder{color:#8C8479}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0A0A; color: #F2EDE4; font-family: 'Jost', sans-serif; overflow: hidden">
<header style="padding: 18px 22px 14px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; border-bottom: 1px solid #1E1C19">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 1px solid #7A6541; display: flex; align-items: center; justify-content: center; color: #C8A565"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 28px; line-height: 1">Concierge</h1>
<div style="font-size: 13px; color: #A39B8E">Asistente con IA · responde al instante</div>
</div>
</header>
<div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column-reverse">
<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{messages}}" as="m" hint-placeholder-count="3">
<sc-if value="{{m.isBot}}" hint-placeholder-val="{{true}}">
<div style="align-self: flex-start; max-width: 300px; padding: 12px 16px; border-radius: 18px 18px 18px 4px; background: #151412; border: 1px solid #26231F; font-size: 15px; line-height: 1.5">{{m.text}}</div>
</sc-if>
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{false}}">
<div style="align-self: flex-end; max-width: 260px; padding: 12px 16px; border-radius: 18px 18px 4px 18px; background: #C8A565; color: #0A0A0A; font-size: 15px; line-height: 1.45">{{m.text}}</div>
</sc-if>
</sc-for>
</div>
</div>
<div style="flex-shrink: 0; padding: 10px 0 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1E1C19">
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 22px">
<sc-for list="{{suggestions}}" as="sug" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{sug.ask}}">{{sug.label}}</button></sc-for>
</div>
<form onSubmit="{{send}}" style="display: flex; gap: 8px; padding: 0 22px; margin: 0">
<input class="field" type="text" aria-label="Mensaje para el concierge" placeholder="Escribile a tu concierge…" value="{{draft}}" onChange="{{onType}}">
<button type="submit" aria-label="Enviar" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 24px; background: #C8A565; color: #0A0A0A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</form>
</div>
<nav aria-label="Navegación principal" style="height: 76px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; padding: 0 6px; border-top: 1px solid #26231F; background: #0E0D0C">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg><span>Inicio</span></a>
<a href="App-Entrevista.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span>Entrevista</span></a>
<a href="App-Concierge.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #C8A565"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16v4M17 18h4"></path></svg><span>Concierge</span></a>
<a href="App-Villa.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span>Mi villa</span></a>
<a href="App-Reservas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 8px 0; text-decoration: none; font-size: 11px; letter-spacing: 0.04em; color: #8C8479"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Reservas</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      messages: [
        { from: 'bot', text: 'Hola, soy tu concierge de Humaya. Estoy aquí las 24 horas para ayudarte con la villa, el lugar o lo que necesités.' },
        { from: 'me', text: '¿Cómo pongo el agua caliente?' },
        { from: 'bot', text: 'El calentador ya está encendido. En la ducha, girá la llave hacia la izquierda y esperá unos 30 segundos. Si no sale caliente, avisame y alguien del equipo pasa por la villa.' }
      ]
    };
  }
  answers() {
    return [
      { label: 'Aire acondicionado', a: 'El control está en la pared, al lado de la cama. Para dormir te recomendamos 23 °C; el botón con la hoja activa el modo silencioso.' },
      { label: 'Luces de la villa', a: 'Tocá el panel junto a la puerta: «Atardecer» baja las luces a un tono cálido y «Noche» apaga todo menos la luz del baño.' },
      { label: 'Desayuno', a: 'El desayuno se sirve de 7:00 a 10:00 a.m. Ya sabemos que Andrés no come frutos secos, así que su plato se prepara aparte.' },
      { label: 'Aguas termales', a: 'Hay varias opciones cerca. Si querés, te reservo entrada y transporte para mañana en la tarde. ¿Les sirve a las 3:00 p.m.?' }
    ];
  }
  push(userText, botText) {
    this.setState({
      draft: '',
      messages: this.state.messages.concat([{ from: 'me', text: userText }, { from: 'bot', text: botText }])
    });
  }
  renderVals() {
    const msgs = this.state.messages.map((m) => ({ text: m.text, isBot: m.from === 'bot', isMe: m.from === 'me' }));
    return {
      messages: msgs,
      draft: this.state.draft,
      suggestions: this.answers().map((x) => ({ label: x.label, ask: () => this.push(x.label, x.a) })),
      onType: (e) => this.setState({ draft: e.target.value }),
      send: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const t = (this.state.draft || '').trim();
        if (!t) return;
        this.push(t, 'Con gusto. Ya se lo paso al equipo de Humaya y te confirmo por aquí en unos minutos.');
      }
    };
  }
}
</script>
</body>
</html>
