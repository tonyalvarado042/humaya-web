<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HUMAYA · Costa Rica</title>
<link rel="icon" href="assets/img/mark-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0A0A0A; --bone:#F4F1EA; --gold:#C8AD85; --gold-soft:#DCC9AA;
  --line:rgba(200,173,133,.28); --line-soft:rgba(244,241,234,.12);
  --display:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:var(--body); font-weight:300;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(24px,5vw,56px); text-align:center;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}

/* fondo: el volcán, muy apagado */
.fondo{ position:fixed; inset:0; z-index:0; overflow:hidden; }
.fondo img{
  width:100%; height:100%; object-fit:cover; object-position:center 45%;
  filter:saturate(.82) brightness(.72);
  transform:scale(1.06); animation:respira 26s ease-in-out infinite alternate;
}
.fondo::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(ellipse 66% 66% at 50% 46%, rgba(8,8,8,.62) 0%, rgba(8,8,8,.5) 55%, rgba(8,8,8,.72) 100%),
    linear-gradient(180deg, rgba(8,8,8,.82) 0%, rgba(8,8,8,.3) 42%, rgba(8,8,8,.86) 100%);
}
@keyframes respira{ from{ transform:scale(1.04) } to{ transform:scale(1.12) } }

.card{ position:relative; z-index:2; max-width:560px; width:100%; }

.mark{ display:block; margin:0 auto; height:clamp(58px,8vw,86px); width:auto; opacity:0; animation:sube 1.3s .1s var(--ease) forwards; }
.word{ display:block; margin:clamp(18px,2.2vw,26px) auto 0; height:clamp(20px,2.7vw,32px); width:auto; opacity:0; animation:sube 1.3s .25s var(--ease) forwards; }
.co{
  font-family:var(--display); font-size:clamp(9px,.8vw,10.5px);
  letter-spacing:.6em; text-transform:uppercase; color:rgba(244,241,234,.62);
  margin-top:clamp(12px,1.5vw,16px); opacity:0; animation:sube 1.3s .38s var(--ease) forwards;
}
.rule{
  width:1px; height:clamp(34px,4.5vw,52px);
  background:linear-gradient(180deg,var(--gold),transparent);
  margin:clamp(26px,3.4vw,40px) auto clamp(22px,2.8vw,32px);
  opacity:0; animation:sube 1.2s .5s var(--ease) forwards;
}

h1{
  font-family:var(--display); font-weight:200;
  font-size:clamp(30px,6vw,50px); line-height:1.1; letter-spacing:-.015em;
  margin:0; color:var(--gold);
  opacity:0; animation:sube 1.4s .6s var(--ease) forwards;
}
h1.gris{ color:var(--bone); }

p.txt{
  margin:clamp(20px,2.6vw,30px) auto 0; max-width:44ch;
  font-size:clamp(15px,1.15vw,17px); line-height:1.82; color:rgba(244,241,234,.72);
  opacity:0; animation:sube 1.4s .72s var(--ease) forwards;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:clamp(32px,4vw,46px);
  font-family:var(--display); font-size:11.5px; letter-spacing:.22em;
  text-transform:uppercase; text-decoration:none;
  padding:16px 40px; border:1px solid var(--gold); color:var(--gold);
  position:relative; overflow:hidden; transition:color .45s var(--ease);
  opacity:0; animation:sube 1.4s .84s var(--ease) forwards;
}
.btn::before{
  content:""; position:absolute; inset:0; background:var(--gold);
  transform:scaleX(0); transform-origin:right; transition:transform .5s var(--ease); z-index:-1;
}
.btn:hover{ color:var(--ink); }
.btn:hover::before{ transform:scaleX(1); transform-origin:left; }

.social{
  margin-top:clamp(38px,4.6vw,54px); display:flex; gap:12px;
  align-items:center; justify-content:center;
  opacity:0; animation:sube 1.4s .96s var(--ease) forwards;
}
.social a{
  display:flex; align-items:center; justify-content:center; width:42px; height:42px;
  border:1px solid var(--line-soft); color:rgba(244,241,234,.7);
  transition:color .4s var(--ease), border-color .4s var(--ease), background .4s var(--ease);
}
.social a:hover{ color:var(--gold); border-color:var(--gold); background:rgba(200,173,133,.07); }
.social svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.social .handle{ font-family:var(--display); font-size:11.5px; letter-spacing:.18em; color:rgba(244,241,234,.48); margin-left:2px; }

.slogan{
  margin-top:clamp(34px,4vw,46px);
  font-family:var(--display); font-size:10px; letter-spacing:.36em;
  text-transform:uppercase; color:rgba(244,241,234,.32);
  opacity:0; animation:sube 1.4s 1.08s var(--ease) forwards;
}

@keyframes sube{ from{ opacity:0; transform:translateY(22px) } to{ opacity:1; transform:none } }
@media (prefers-reduced-motion: reduce){
  .mark,.word,.co,.rule,h1,p.txt,.btn,.social,.slogan{ animation:none; opacity:1; }
  .fondo img{ animation:none; transform:none; }
}
@media (max-width:520px){ .btn{ width:100%; } }
</style>
</head>

<body>
<div class="fondo"><img src="assets/img/vol-wide.jpg" alt=""></div>

<main class="card">
  <img class="mark" src="assets/img/mark-gold.png" alt="">
  <img class="word" src="assets/img/wordmark-white.png" alt="HUMAYA">
  <div class="co">Costa Rica</div>
  <div class="rule"></div>

  <h1 id="titulo">Listo.</h1>
  <p class="txt" id="texto">Tu correo quedó confirmado.</p>

  <a class="btn" id="volver" href="https://stayhumaya.com/">Volver al sitio</a>

  <div class="social">
    <a href="https://instagram.com/stayhumaya" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @stayhumaya">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.8" y="2.8" width="18.4" height="18.4" rx="5.4"/>
        <circle cx="12" cy="12" r="4.3"/>
        <circle cx="17.3" cy="6.7" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="https://facebook.com/stayhumaya" target="_blank" rel="noopener noreferrer" aria-label="Facebook: @stayhumaya">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.8" y="2.8" width="18.4" height="18.4" rx="5.4"/>
        <path d="M15 8.1h-1.5a1.8 1.8 0 0 0-1.8 1.8v8.4"/>
        <path d="M9.8 12.6h4.7"/>
      </svg>
    </a>
    <span class="handle">@stayhumaya</span>
  </div>

  <div class="slogan">Become more human</div>
</main>

<script>
/* Estado y idioma vienen del enlace: ?c=ok|ya|vencido|malo & l=es|en|de|fr */
const COPY = {
  es:{
    ok:      ["Listo.",              "Tu correo quedó confirmado. Te escribimos a vos primero cuando abran las primeras reservas."],
    ya:      ["Ya estabas dentro.",  "Este correo ya estaba confirmado. No tenés que hacer nada más."],
    vencido: ["El enlace venció.",   "Este enlace ya no sirve. Volvé a dejar tu correo en el sitio y te mandamos uno nuevo."],
    malo:    ["Enlace inválido.",    "No pudimos leer este enlace. Volvé a dejar tu correo en el sitio."],
    volver: "Volver al sitio"
  },
  en:{
    ok:      ["Done.",               "Your email is confirmed. We write to you first when the first reservations open."],
    ya:      ["You were already in.","This email was already confirmed. There is nothing else to do."],
    vencido: ["The link expired.",   "This link no longer works. Leave your email on the site again and we will send a new one."],
    malo:    ["Invalid link.",       "We could not read this link. Please leave your email on the site again."],
    volver: "Back to the site"
  },
  de:{
    ok:      ["Fertig.",             "Deine E-Mail ist bestätigt. Wir schreiben dir zuerst, sobald die ersten Reservierungen öffnen."],
    ya:      ["Du warst schon dabei.","Diese E-Mail war bereits bestätigt. Es gibt nichts weiter zu tun."],
    vencido: ["Der Link ist abgelaufen.","Dieser Link funktioniert nicht mehr. Hinterlasse deine E-Mail erneut auf der Website."],
    malo:    ["Ungültiger Link.",    "Wir konnten diesen Link nicht lesen. Bitte hinterlasse deine E-Mail erneut."],
    volver: "Zurück zur Website"
  },
  fr:{
    ok:      ["C'est fait.",         "Votre email est confirmé. Nous vous écrivons en premier dès l'ouverture des réservations."],
    ya:      ["Vous y étiez déjà.",  "Cet email était déjà confirmé. Il n'y a rien d'autre à faire."],
    vencido: ["Le lien a expiré.",   "Ce lien ne fonctionne plus. Laissez de nouveau votre email sur le site."],
    malo:    ["Lien invalide.",      "Nous n'avons pas pu lire ce lien. Merci de laisser de nouveau votre email."],
    volver: "Retour au site"
  }
};

const q = new URLSearchParams(location.search);
let estado = q.get("c");
if (!["ok","ya","vencido","malo"].includes(estado)) estado = "ok";

let lang = (q.get("l") || navigator.language || "es").slice(0,2).toLowerCase();
if (!COPY[lang]) lang = "en";

const t = COPY[lang];
document.documentElement.lang = lang;
document.getElementById("titulo").textContent = t[estado][0];
document.getElementById("texto").textContent  = t[estado][1];
document.getElementById("volver").textContent = t.volver;
document.title = "HUMAYA · " + t[estado][0];

/* los estados de error van en color hueso, no en oro */
if (estado === "vencido" || estado === "malo") {
  document.getElementById("titulo").classList.add("gris");
}
</script>
</body>
</html>
