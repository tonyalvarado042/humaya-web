name: Metodo Humaya CI

on:
  push:
    paths:
      - "metodo-humaya/**"
      - ".github/workflows/metodo-humaya-ci.yml"
  pull_request:
    paths:
      - "metodo-humaya/**"
      - ".github/workflows/metodo-humaya-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metodo-humaya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metodo-humaya/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
